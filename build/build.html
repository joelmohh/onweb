<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cube</title>
</head>

<body>
    <canvas id="c"></canvas>
</body>
<script>
    let ctx = c.getContext("2d")

    let rX = 0
    let rY = 0
    let sX = 0.5
    let sY = 0.8
    let pS = 1
    let bH = 200 

    const v = []
    for (let i = 0; i < 8; i++) {
        v.push([
            i & 1 ? 1 : -1,
            i & 2 ? 1 : -1,
            i & 4 ? 1 : -1,
        ])
    }

    const e = []
    for (let i = 0; i < 8; i++) {
        for (let bit = 1; bit < 8; bit <<= 1) {
            if (!(i & bit)) e.push([i, i | bit])
        }
    }

    let aCtx, dOsc, dFilter, dGain

    function startAudio() {
        if (aCtx) return 
        aCtx = new AudioContext()
        dOsc = aCtx.createOscillator()
        dOsc.type = "sawtooth"
        dFilter = aCtx.createBiquadFilter()
        dGain.gain.value = 0.06
        dOsc.connect(dFilter)
        dFilter.connect(dGain)
        dGain.connect(aCtx.destination)
        dOsc.start()
    }

    function playBlip(frequency) {
        if (!aCtx) return

        const osc = aCtx.createOscillator()
        const gain = aCtx.createGain()
        const now = aCtx.currentTime

        osc.frequency.value = frequency
        osc.connect(gain)
        gain.connect(aCtx.destination)

        gain.gain.setValueAtTime(0.2, now)
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3)

        osc.start()
        osc.stop(now + 0.3)
    }

    onpointermove = (e) => {
        const mY = e.clientY / innerHeight
        const mX = e.clientX / innerWidth

        sY = (mX - 0.5) * 5
        sX = (mY - 0.5) * 5

        if (aCtx) {
            dOsc.frequency.value = 80 + (1 - mY) * 400
            dFilter.frequency.value = 200 + mX * 3000
        }
    }

    onpointerdown = () => {
        startAudio()
        playBlip(200 + Math.random() * 600)
        pS = 1.6
        bH = Math.random() * 360
    }

    function p(P, S) {
        let [x, y, z] = P.map((n) => n * S)

        const CY = Math.cos(rY)
        const SY = Math.sin(rY)

        ;[x, z] = [x * CY - z * SY, x * SY + z * CY]

        const CX = Math.cos(rX)
        const SX = Math.sin(rX)

        ;[y, z] = [y * CX - z * SX, y * SX + z * CX]

        const per = 4 / (z + 5)

        const u = c.height / 6

        return [
            c.width / 2 + x * per * u,
            c.height / 2 + y * per * u
        ]
    }

    function draw() {
        ctx.fillStyle = "rgba(0,0,0, 0.2)"
        ctx.fillRect(0, 0, c.width, c.height)

        ctx.lineWidth = 2

        const s = [1, 0.5]
        s.forEach((scale, index) => {
            ctx.strokeStyle = `hsl(${bH + index * 120}, 90%, 60%)`
            ctx.beginPath()
            e.forEach(([from, to]) =>{
                ctx.moveTo(...p(v[from], scale * pS))
                ctx.lineTo(...p(v[to], scale * pS))
            })      
            ctx.stroke()      
        })
    }

    onresize = () => {
        c.width = innerWidth
        c.height = innerHeight
    }
    onresize()

    let lT = 0

    function f(n){
        const dt = Math.min((n - lT) / 1000, 0.1)
        lT = n

        rX += sX * dt
        rY += sY * dt
        pS += (1 - pS) * 5 * dt

        draw()
        requestAnimationFrame(f)
    }

    requestAnimationFrame(f)
</script>

</html>
